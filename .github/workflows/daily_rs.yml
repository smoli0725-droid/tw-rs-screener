name: Daily Taiwan RS Update

on:
  schedule:
    # GitHub Actions cron is UTC and is NOT punctual (often tens of minutes
    # late, sometimes ~hours). These weekday slots are Taipei-oriented after
    # cash close (13:30), covering 17:30–21:30 台北 so later runs catch
    # TWSE STOCK_DAY_ALL / Yahoo when they catch up.
    #
    # 17:00 台北 is too early: Yahoo and TWSE snapshots frequently still
    # show the previous session, so that slot used to fail freshness.
    #
    # 台北 → UTC:
    #   17:30=09:30  18:00=10:00  18:30=10:30  19:00=11:00  19:30=11:30
    #   20:00=12:00  20:30=12:30  21:00=13:00  21:30=13:30
    #
    # For a punctual run, point an external cron at workflow_dispatch
    # (gh workflow run daily_rs.yml) instead of relying on schedule.
    #
    # Weekday holidays (and weekends, if dispatched) are a clean skip:
    # market_calendar.py exits 0 before the download, and this job does
    # not commit. Late data on a real trading day still fails the
    # calculator with exit 2 so the next slot retries.
    - cron: "30 9 * * 1-5"
    - cron: "0 10 * * 1-5"
    - cron: "30 10 * * 1-5"
    - cron: "0 11 * * 1-5"
    - cron: "30 11 * * 1-5"
    - cron: "0 12 * * 1-5"
    - cron: "30 12 * * 1-5"
    - cron: "0 13 * * 1-5"
    - cron: "30 13 * * 1-5"
  workflow_dispatch: {}   # Actions → Daily Taiwan RS Update → Run workflow

permissions:
  contents: write

concurrency:
  group: daily-rs
  cancel-in-progress: false

jobs:
  rs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Skip if already fresh today
        id: skip
        run: |
          TODAY=$(TZ=Asia/Taipei date +%F)
          if [ -f output/資料日期.txt ]; then
            DATA_DATE=$(grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}' output/資料日期.txt | head -1)
            echo "repo_data_date=$DATA_DATE today=$TODAY"
            if [ "$DATA_DATE" = "$TODAY" ]; then
              echo "Already updated for $TODAY — skipping."
              echo "skip=true" >> "$GITHUB_OUTPUT"
            else
              echo "skip=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip if TWSE is closed
        id: closed
        if: steps.skip.outputs.skip != 'true'
        run: python market_calendar.py

      - name: Run RS calculator + pattern screener
        if: ${{ steps.skip.outputs.skip != 'true' && steps.closed.outputs.closed != 'true' }}
        run: python rs_calculator.py

      - name: Commit results
        if: ${{ steps.skip.outputs.skip != 'true' && steps.closed.outputs.closed != 'true' }}
        run: |
          set -euo pipefail
          git config user.name "rs-bot"
          git config user.email "rs-bot@users.noreply.github.com"

          git add output/
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi

          MSG="RS update $(TZ=Asia/Taipei date +%F)"
          git commit -m "$MSG"

          # Keep the just-built output/ tree if origin/main also touched
          # output/ (rebase conflicts on breakouts.json etc.). Never force-push main.
          git fetch origin main
          push_output() {
            git push origin HEAD:main
          }

          if git rebase -X ours origin/main; then
            if push_output; then
              exit 0
            fi
          else
            echo "rebase conflicted; will replay output/ onto origin/main"
            git rebase --abort || true
          fi

          replay_output_on_origin() {
            git fetch origin main
            tmp=$(mktemp -d)
            cp -a output "$tmp/output"
            git reset --hard origin/main
            rm -rf output
            cp -a "$tmp/output" output
            git add output/
            git commit -m "$MSG" || {
              echo "no changes after replaying output/"
              return 0
            }
            push_output
          }

          for attempt in 1 2 3; do
            echo "resync output/ onto origin/main (attempt ${attempt})"
            if replay_output_on_origin; then
              exit 0
            fi
            sleep $((attempt * 4))
          done
          echo "push failed after retries (no force-push)"
          exit 1
