name: Deploy Web Site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "output/app/**"
      - "functions/**"
      - "wrangler.toml"
      - "migrations/**"
      - "scripts/inject_pages_config.py"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:
  # Daily RS commits with the default GITHUB_TOKEN, which does not trigger
  # other workflows' `push` events. Chain this deploy after that run completes.
  # A green Daily RS that pushed nothing (TWSE holiday, weekend, or already
  # fresh) is ignored so we do not redeploy unchanged output.
  workflow_run:
    workflows: ["Daily Taiwan RS Update"]
    types: [completed]

permissions:
  contents: read
  actions: read

concurrency:
  group: web-deploy
  cancel-in-progress: true

jobs:
  prepare:
    name: Decide whether to deploy
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.gate.outputs.proceed }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Same ref the deploy job uses, so a Daily RS push is visible
          # as a branch tip that differs from workflow_run.head_sha.
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.sha }}

      - name: Skip deploy when Daily RS published nothing
        id: gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          JOBS_URL: ${{ github.event_name == 'workflow_run' && format('https://api.github.com/repos/{0}/actions/runs/{1}/jobs', github.repository, github.event.workflow_run.id) || '' }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "workflow_run" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          TIP=$(git rev-parse HEAD)
          START="${{ github.event.workflow_run.head_sha }}"
          echo "branch tip=$TIP daily_rs_head=$START"
          if [ "$TIP" != "$START" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # No new commit on the branch tip. Skip deploy only when the
          # calculator step itself was skipped (holiday, weekend, or already
          # fresh). If that step ran, deploy anyway — the push may not be
          # visible on this checkout yet. Step name must match daily_rs.yml.
          python3 - << 'PY'
          import json, os, urllib.request
          out = os.environ["GITHUB_OUTPUT"]
          url = os.environ.get("JOBS_URL") or ""
          token = os.environ.get("GITHUB_TOKEN") or ""

          def proceed(value, note):
              print(note)
              with open(out, "a", encoding="utf-8") as fh:
                  fh.write(f"proceed={value}\n")

          if not url or not token:
              proceed("true", "missing jobs URL; deploying")
              raise SystemExit(0)
          req = urllib.request.Request(url, headers={
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "User-Agent": "tw-rs-screener-deploy",
          })
          try:
              with urllib.request.urlopen(req, timeout=20) as resp:
                  payload = json.load(resp)
          except Exception as exc:
              proceed("true", f"could not read Daily RS jobs ({exc}); deploying")
              raise SystemExit(0)
          conclusions = []
          for job in payload.get("jobs") or []:
              for step in job.get("steps") or []:
                  if step.get("name") == "Run RS calculator + pattern screener":
                      conclusions.append(step.get("conclusion"))
          print(f"rs_calculator_steps={conclusions or 'missing'}")
          if conclusions and all(item == "skipped" for item in conclusions):
              proceed("false", "Daily RS skipped the calculator. Not deploying.")
          else:
              proceed("true", "calculator ran or status unknown; deploying")
          PY

  deploy:
    needs: prepare
    if: ${{ needs.prepare.outputs.proceed == 'true' }}
    runs-on: ubuntu-latest
    env:
      CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
      D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
      R2_TEACHING_BUCKET: ${{ secrets.R2_TEACHING_BUCKET }}
    steps:
      - uses: actions/checkout@v4
        with:
          # workflow_run.head_sha is Daily RS's starting commit, not the
          # output/ commit it pushed (GITHUB_TOKEN push does not chain).
          # Check out that run's branch tip so we deploy the new files.
          # For push / workflow_dispatch, github.sha is the triggering commit.
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.sha }}

      - name: Check Cloudflare secrets
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] || [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "::error::缺少 Cloudflare secrets。請到 repo Settings → Secrets and variables → Actions 新增："
            echo "  1) CLOUDFLARE_API_TOKEN"
            echo "  2) CLOUDFLARE_ACCOUNT_ID"
            echo "設定步驟見 README「網站版」章節。"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install Pages Functions dependencies
        working-directory: functions
        run: npm ci

      - name: Bundle daily JSON into site/data
        run: |
          rm -rf site/data
          mkdir -p site/data
          if [ -d output/app ]; then
            cp -a output/app/. site/data/
          else
            echo '{"data_date":null,"is_fresh":false,"message":"no output/app yet","counts":{}}' > site/data/meta.json
            echo '[]' > site/data/rs85.json
            echo '[]' > site/data/patterns.json
          fi
          touch site/.nojekyll
          ls -la site/data | head

      - name: Inject Clerk publishable key, D1 id, and R2 bucket
        run: python3 scripts/inject_pages_config.py

      # Token needs Account / R2 / Edit. Bucket may already exist — do not block deploy.
      - name: Ensure R2 teaching bucket
        if: env.R2_TEACHING_BUCKET != ''
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "3.99.0"
          command: r2 bucket create flashpick-teaching

      # CI 無法互動建立專案；deploy 在專案不存在時會失敗 (8000007)
      - name: Ensure Cloudflare Pages project exists
        uses: cloudflare/wrangler-action@v3
        continue-on-error: true
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "3.99.0"
          command: pages project create tradingvenator --production-branch=main

      # Schema already applied via dashboard/MCP; token may lack D1 Edit — don't block Pages deploy.
      # Push secrets are optional: this job does not read VAPID_* or ALERT_PUSH_SECRET.
      - name: Apply D1 schema
        if: env.D1_DATABASE_ID != ''
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "3.99.0"
          command: d1 execute tradingvenator --remote --file=migrations/0001_init.sql --yes

      - name: Apply push subscription schema
        if: env.D1_DATABASE_ID != ''
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "3.99.0"
          command: d1 execute tradingvenator --remote --file=migrations/0002_push_subscriptions.sql --yes

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "3.99.0"
          # wrangler.toml pages_build_output_dir = site (Functions live in /functions)
          command: pages deploy --project-name=tradingvenator --branch=main --commit-dirty=true
